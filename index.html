<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b59ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Dojo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Study Dojo – Class 2 Practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥋%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--surface:#ffffff;--ink:#14213d;--muted:#54607d;--line:#c9dbf2;--accent:#2b59ff;--gold:#ffb703;--good:#0f9d63;--bad:#d92d20;--math:#ff6b35;--english:#8b5cf6;--evs:#12b76a;--cs:#0ea5e9;--shadow:0 3px 0 rgba(20,33,61,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a33;--surface:#182646;--ink:#f1f5ff;--muted:#a9b6d6;--line:#2a3c66;--accent:#6b8bff;--good:#3ddc97;--bad:#ff8a80;--shadow:0 3px 0 rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0e1a33;--surface:#182646;--ink:#f1f5ff;--muted:#a9b6d6;--line:#2a3c66;--accent:#6b8bff;--good:#3ddc97;--bad:#ff8a80;--shadow:0 3px 0 rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.35}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
h1{font-size:30px;line-height:1.1;margin:0}
h2{font-size:22px;margin:22px 0 8px}
small,.muted{color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin:12px 0}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-size:19px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.25);margin:10px 0}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0e1a33}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.ghost{background:none;border:0;font-size:22px;padding:6px 10px;color:var(--muted)}
/* belt: the one bold element */
.belt{position:relative;margin:14px 0 8px;padding:18px 20px 16px;border-radius:14px;background:var(--bc);color:var(--bt);box-shadow:var(--shadow);border:3px solid rgba(0,0,0,.28)}
.belt::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(0,0,0,.28);border-radius:8px;pointer-events:none}
.belt .knot{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:14px;background:var(--bc);border:3px solid rgba(0,0,0,.35);box-shadow:inset 0 0 0 5px rgba(255,255,255,.18)}
.belt .name{font-size:26px;font-weight:700;margin:0;padding-right:70px}
.belt .meter{height:12px;background:rgba(0,0,0,.25);border-radius:99px;margin:10px 70px 6px 0;overflow:hidden}
.belt .meter i{display:block;height:100%;background:#fff;border-radius:99px}
.belt .sub{font-size:15px;padding-right:70px}
.today{margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-top:9px solid var(--c);border-radius:20px;padding:12px 14px 14px;min-height:132px;box-shadow:var(--shadow)}
.subj .em{font-size:36px;display:block}
.subj b{display:block;font-size:21px;margin-top:2px}
.subj small{display:block}
.subj.lock{opacity:.6;cursor:default}
.tag{position:absolute;top:8px;right:8px;background:var(--gold);color:#14213d;border-radius:99px;padding:1px 10px;font-size:14px;font-weight:600}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow);font-size:18px}
.row .tx{flex:1}
.row b{font-weight:600}
.row small{display:block}
.row.soon{opacity:.55;cursor:default}
.row.hi{border-color:var(--accent)}
.st{color:var(--gold);letter-spacing:2px;font-size:20px;white-space:nowrap}
.top{display:flex;align-items:center;gap:8px}
.runs{font-weight:600;white-space:nowrap}
.qcard{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px 16px 14px;margin:14px 0;box-shadow:var(--shadow)}
.qmeta{font-size:14px;color:var(--muted);margin-bottom:8px}
.prompt{font-size:24px;font-weight:500;line-height:1.4;padding-right:46px}
.speak{position:absolute;top:10px;right:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px;font-size:20px;padding:4px 8px}
.opt{display:block;width:100%;text-align:left;min-height:58px;padding:12px 16px;margin:9px 0;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font-size:21px;font-weight:500;box-shadow:var(--shadow)}
.opt.ok{border-color:var(--good);background:rgba(15,157,99,.18)}
.opt.no{border-color:var(--bad);background:rgba(217,45,32,.14)}
.opt[disabled]{cursor:default}
.numval{min-height:64px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-size:34px;font-weight:600;text-align:center;padding:10px;margin:10px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;font-size:26px;font-weight:600;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.pad button.go{background:var(--accent);color:#fff;border-color:transparent}
:root:not([data-theme="light"]) .pad button.go{color:#0e1a33}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:500}
.fb.ok{background:rgba(15,157,99,.16);border:2px solid var(--good)}
.fb.no{background:rgba(217,45,32,.13);border:2px solid var(--bad)}
.six{font-size:30px;text-align:center;animation:pop .5s}
.groups{margin-bottom:8px}
.grp{display:inline-block;padding:6px 8px;border:2px dashed var(--line);border-radius:12px;margin:4px 6px 4px 0;font-size:22px;letter-spacing:2px}
.cash{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.coin{display:inline-grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--gold);color:#14213d;font-size:17px;font-weight:700;border:3px solid #c98a10}
.note{display:inline-grid;place-items:center;min-width:78px;height:42px;border-radius:8px;background:#bfe6cc;color:#14213d;font-size:19px;font-weight:700;border:2px solid #4c9a68}
.clock{width:150px;height:150px;display:block;margin:0 auto 8px}
.cf{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.cn{fill:var(--ink);font-size:10px;font-weight:600}
.hh{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.mh{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.cc{fill:var(--ink)}
.seq{font-size:30px;letter-spacing:4px;margin-top:6px}
.gap{color:var(--accent);border-bottom:3px solid var(--accent)}
.center{text-align:center}
.big{font-size:60px;letter-spacing:6px;color:var(--gold)}
.name-in{width:100%;font-size:24px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">This practice page needs JavaScript. Please turn it on and reload.</p></noscript>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a;};
var pick=function(a){return a[rnd(0,a.length-1)];};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var hh=function(x){return ((x-1+12)%12)+1;};
var sum=function(a){return a.reduce(function(p,c){return p+c;},0);};

/* ---------- saved progress (this browser only) ---------- */
var KEY='studydojo.class2.v1';
var blank=function(){return {name:'',xp:0,streak:0,last:'',topics:{}};};
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return Object.assign(blank(),r);}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var dstr=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

var BELTS=[{n:'White',xp:0,c:'#f4f4f0',t:'#14213d'},{n:'Yellow',xp:100,c:'#ffd23f',t:'#14213d'},{n:'Orange',xp:250,c:'#ff8c1a',t:'#14213d'},{n:'Green',xp:450,c:'#2e9e5b',t:'#ffffff'},{n:'Blue',xp:700,c:'#2f6fe4',t:'#ffffff'},{n:'Brown',xp:1000,c:'#8a5a3b',t:'#ffffff'},{n:'Black',xp:1400,c:'#1b1b22',t:'#ffffff'}];
function beltIdx(xp){var k=0;BELTS.forEach(function(b,i){if(xp>=b.xp)k=i;});return k;}

/* ---------- question builders ---------- */
function Qnum(html,ans,x){return Object.assign({t:'num',html:html,ans:String(ans)},x||{});}
function Qch(html,ans,opts,x){var u=[];opts.map(String).forEach(function(o){if(u.indexOf(o)<0)u.push(o);});return Object.assign({t:'ch',html:html,ans:String(ans),opts:shuffle(u)},x||{});}
function fromItem(it){return Qch(esc(it[0]),it[1],it.slice(1));}

var NAMES=['Riya','Aman','Meera','Kabir','Diya','Arjun','Anaya','Vihaan'];
var THINGS=[['marbles','🔵'],['stickers','⭐'],['mangoes','🥭'],['pencils','✏️'],['balloons','🎈'],['bananas','🍌'],['cookies','🍪']];

/* ---------- maths generators (each takes a level 1 to 3) ---------- */
var GEN={};
GEN.m1=function(lv){
 if(lv===1){
  if(Math.random()<.5){var n=rnd(11,99),k=pick(['tens','ones']);return Qnum('In <b>'+n+'</b>, how many <b>'+k+'</b> are there?',k==='tens'?Math.floor(n/10):n%10,{hint:n+' is '+Math.floor(n/10)+' tens and '+(n%10)+' ones.'});}
  var m=rnd(11,98);return Math.random()<.5?Qnum('Which number comes <b>just after</b> '+m+'?',m+1):Qnum('Which number comes <b>just before</b> '+m+'?',m-1);
 }
 if(lv===2){
  if(Math.random()<.5){var t=rnd(1,9),o=rnd(0,9);return Qnum('<b>'+t+'</b> tens and <b>'+o+'</b> ones make which number?',t*10+o);}
  var a=rnd(10,99),b=rnd(10,99);while(b===a)b=rnd(10,99);var g=Math.random()<.5;
  return Qch('Which number is <b>'+(g?'greater':'smaller')+'</b>?',g?Math.max(a,b):Math.min(a,b),[a,b]);
 }
 var r=Math.random();
 if(r<.25){var p=rnd(10,89);return Qnum('What is <b>10 more</b> than '+p+'?',p+10);}
 if(r<.5){var q=rnd(20,99);return Qnum('What is <b>10 less</b> than '+q+'?',q-10);}
 if(r<.75){var s=[];while(s.length<3){var v=rnd(10,99);if(s.indexOf(v)<0)s.push(v);}return Qch('Which is the <b>biggest</b> number?',Math.max.apply(null,s),s);}
 var st=pick([2,5,10]),s0=st*rnd(1,8),seq=[0,1,2,3,4].map(function(i){return s0+i*st;}),gp=rnd(1,3);
 return Qnum('Fill the gap: '+seq.map(function(v,i){return i===gp?'<b class="gap">__</b>':v;}).join(', '),seq[gp],{hint:'The numbers go up by '+st+'.'});
};
function nr2(){var ua=rnd(0,8),ub=rnd(0,9-ua),ta=rnd(1,8),tb=rnd(1,9-ta);return [ta*10+ua,tb*10+ub];}
function rg2(){var ua=rnd(2,9),ub=rnd(10-ua,9),ta=rnd(1,7),tb=rnd(1,8-ta);return [ta*10+ua,tb*10+ub];}
GEN.m2=function(lv){
 var p=lv===1?nr2():lv===2?rg2():(Math.random()<.5?nr2():rg2()),a=p[0],b=p[1];
 if(lv<3)return Qnum(a+' + '+b+' = ?',a+b,{hint:'Add the ones first, then the tens.'});
 var n=pick(NAMES),th=pick(THINGS)[0];
 return Qnum(n+' has <b>'+a+'</b> '+th+'. Then '+n+' gets <b>'+b+'</b> more. How many '+th+' does '+n+' have now?',a+b,{hint:a+' + '+b});
};
function nb2(){var ua=rnd(0,9),ub=rnd(0,ua),ta=rnd(2,9),tb=rnd(1,ta-1);return [ta*10+ua,tb*10+ub];}
function bw2(){var ua=rnd(0,8),ub=rnd(ua+1,9),ta=rnd(2,9),tb=rnd(1,ta-1);return [ta*10+ua,tb*10+ub];}
GEN.m3=function(lv){
 var p=lv===1?nb2():lv===2?bw2():(Math.random()<.5?nb2():bw2()),a=p[0],b=p[1];
 if(lv<3)return Qnum(a+' − '+b+' = ?',a-b,{hint:'Subtract the ones first. Borrow from the tens if you need to.'});
 var n=pick(NAMES),th=pick(THINGS)[0];
 return Qnum(n+' had <b>'+a+'</b> '+th+'. '+n+' gave away <b>'+b+'</b>. How many '+th+' are left?',a-b,{hint:a+' − '+b});
};
GEN.m4=function(lv){
 if(lv===1){var n=rnd(101,999),k=pick(['hundreds','tens','ones']),H=Math.floor(n/100),T=Math.floor(n/10)%10,U=n%10,d={hundreds:H,tens:T,ones:U}[k];
  return Qnum('In <b>'+n+'</b>, how many <b>'+k+'</b> are there?',d,{hint:n+' = '+H+' hundreds, '+T+' tens, '+U+' ones.'});}
 if(lv===2){var h=rnd(1,9),t=rnd(0,9),u=rnd(0,9);
  return Math.random()<.5?Qnum(h*100+' + '+t*10+' + '+u+' = ?',h*100+t*10+u):Qnum('<b>'+h+'</b> hundreds, <b>'+t+'</b> tens and <b>'+u+'</b> ones make which number?',h*100+t*10+u);}
 var r=Math.random();
 if(r<.34){var a=rnd(100,999),b=rnd(100,999);while(b===a)b=rnd(100,999);var g=Math.random()<.5;return Qch('Which number is <b>'+(g?'greater':'smaller')+'</b>?',g?Math.max(a,b):Math.min(a,b),[a,b]);}
 if(r<.67){var p=rnd(100,899);return Qnum('What is <b>100 more</b> than '+p+'?',p+100);}
 var m=rnd(101,998),up=Math.random()<.5;return Qnum('Which number comes <b>just '+(up?'after':'before')+'</b> '+m+'?',up?m+1:m-1);
};
function an3(){var ha=rnd(1,8),hb=rnd(1,9-ha),ta=rnd(0,8),tb=rnd(0,9-ta),ua=rnd(0,8),ub=rnd(0,9-ua);return [ha*100+ta*10+ua,hb*100+tb*10+ub];}
function sn3(){var ha=rnd(2,9),hb=rnd(1,ha-1),ta=rnd(0,9),tb=rnd(0,ta),ua=rnd(0,9),ub=rnd(0,ua);return [ha*100+ta*10+ua,hb*100+tb*10+ub];}
function ar3(){
 if(Math.random()<.5){var ua=rnd(2,9),ub=rnd(10-ua,9),ta=rnd(0,8),tb=rnd(0,8-ta),ha=rnd(1,8),hb=rnd(1,9-ha);return [ha*100+ta*10+ua,hb*100+tb*10+ub];}
 var u2=rnd(0,8),v2=rnd(0,9-u2),t2=rnd(2,9),s2=rnd(10-t2,9),h2=rnd(1,7),g2=rnd(1,8-h2);return [h2*100+t2*10+u2,g2*100+s2*10+v2];}
function sb3(){
 if(Math.random()<.5){var ua=rnd(0,8),ub=rnd(ua+1,9),ta=rnd(1,9),tb=rnd(0,ta-1),ha=rnd(2,9),hb=rnd(1,ha-1);return [ha*100+ta*10+ua,hb*100+tb*10+ub];}
 var u2=rnd(0,9),v2=rnd(0,u2),t2=rnd(0,8),s2=rnd(t2+1,9),h2=rnd(2,9),g2=rnd(1,h2-1);return [h2*100+t2*10+u2,g2*100+s2*10+v2];}
GEN.m5=function(lv){
 var p;
 if(lv===1){if(Math.random()<.6){p=an3();return Qnum(p[0]+' + '+p[1]+' = ?',p[0]+p[1],{hint:'Add the ones, then the tens, then the hundreds.'});}p=sn3();return Qnum(p[0]+' − '+p[1]+' = ?',p[0]-p[1],{hint:'Subtract the ones, then the tens, then the hundreds.'});}
 if(lv===2){p=ar3();return Qnum(p[0]+' + '+p[1]+' = ?',p[0]+p[1],{hint:'Carry 1 to the next place when a column makes 10 or more.'});}
 p=sb3();return Qnum(p[0]+' − '+p[1]+' = ?',p[0]-p[1],{hint:'Borrow from the next place when the top digit is smaller.'});
};
GEN.m6=function(lv){
 if(lv===1){var g=rnd(2,5),k=rnd(2,5),it=pick(THINGS),em=it[1],th=it[0];
  var grp='<div class="groups">'+Array.from({length:g},function(){return '<span class="grp">'+em.repeat(k)+'</span>';}).join('')+'</div>';
  return Qnum(grp+'There are <b>'+g+' groups</b> of <b>'+k+'</b>. How many '+th+' in all?',g*k,{hint:Array(g).fill(k).join(' + ')+' = '+g*k});}
 if(lv===2){var t=pick([2,3,4,5,10]);
  if(Math.random()<.3){var m=rnd(2,5);return Qnum(Array(m).fill(t).join(' + ')+' = ?',t*m,{hint:m+' × '+t+' = '+t*m});}
  var n=rnd(1,10);return Math.random()<.5?Qnum(t+' × '+n+' = ?',t*n,{hint:n+' groups of '+t}):Qnum(n+' × '+t+' = ?',t*n,{hint:n+' groups of '+t});}
 if(Math.random()<.5){var a=rnd(6,9),b=rnd(2,10);return Qnum(a+' × '+b+' = ?',a*b,{hint:b+' groups of '+a});}
 var bx=rnd(2,9),per=rnd(2,10),th2=pick(THINGS)[0];
 return Qnum('There are <b>'+bx+'</b> boxes. Each box has <b>'+per+'</b> '+th2+'. How many '+th2+' in all?',bx*per,{hint:bx+' × '+per});
};
GEN.m7=function(lv){
 if(lv===1){var d=rnd(2,5),q=rnd(1,5),it=pick(THINGS);
  return Qnum('<div class="groups"><span class="grp">'+it[1].repeat(d*q)+'</span></div><b>'+d*q+'</b> '+it[0]+' are shared equally among <b>'+d+'</b> friends. How many does each friend get?',q,{hint:d*q+' ÷ '+d+' = '+q});}
 if(lv===2){var e=pick([2,3,4,5,10]),r=rnd(1,10);return Qnum(e*r+' ÷ '+e+' = ?',r,{hint:'Think: '+e+' × ? = '+e*r});}
 if(Math.random()<.5){var f=rnd(6,9),s=rnd(2,10);return Qnum(f*s+' ÷ '+f+' = ?',s,{hint:'Think: '+f+' × ? = '+f*s});}
 var x=rnd(2,9),y=rnd(2,9),th=pick(THINGS)[0];
 return Qnum('There are <b>'+x*y+'</b> '+th+'. Each box holds <b>'+x+'</b> '+th+'. How many boxes are needed?',y,{hint:x*y+' ÷ '+x+' = '+y});
};

GEN.m11=function(lv){

function nextQ(){Q.cur=Q.queue.shift();Q.q=Q.cur.make();Q.res=null;Q.input='';}
function answer(v){
 if(!Q||Q.res)return;v=String(v).trim();if(v==='')return;
 if(Q.q.t==='num'){var k=parseInt(v,10);if(isNaN(k))return;v=String(k);}
 var ok=v===Q.q.ans;
 if(ok){Q.streak++;Q.runs++;if(!Q.cur.retry)Q.first++;}
 else{Q.streak=0;if(!Q.cur.retry){Q.queue.push({make:Q.cur.make,retry:true});Q.plan++;}}
 Q.res={ok:ok,v:v,six:ok&&Q.streak>0&&Q.streak%6===0,msg:pick(['Great job!','Well done!','Super!','Nice one!','Correct!'])};
 render();
}
function advance(){Q.done++;if(!Q.queue.length){finish();return;}nextQ();render();}
function finish(){
 var score=Q.first/Q.firstTotal,xp=Q.first*10+(score>=.8?20:0),before=beltIdx(S.xp);
 S.xp+=xp;var after=beltIdx(S.xp);
 var tp=S.topics[Q.t.id]||(S.topics[Q.t.id]={plays:0,best:0,lvl:1,correct:0,total:0});
 tp.plays++;tp.best=Math.max(tp.best,score);tp.correct+=Q.first;tp.total+=Q.firstTotal;
 var note='';
 if(Q.t.gen){
  if(score>=.8&&tp.lvl<3){tp.lvl++;note='Level up! Next round is Level '+tp.lvl+'.';}
  else if(score<=.4&&tp.lvl>1){tp.lvl--;note='Next round is a little easier (Level '+tp.lvl+') to build confidence.';}
 }
 var today=dstr(new Date()),y=dstr(new Date(Date.now()-864e5));
 if(S.last!==today){S.streak=S.last===y?S.streak+1:1;S.last=today;}

}

 h+='</div>';
 var sg=suggest();
 if(sg){h+='<button class="row hi" data-a="start" data-t="'+sg.id+'"><span class="tx"><b>Try this next</b><small>'+esc(sg.title)+'</small></span><span class="st">▶</span></button>';}
 h+='<h2>Subjects</h2><div class="grid">';
 var first=ORDER.filter(function(k){return td.indexOf(k)>=0;}),rest=ORDER.filter(function(k){return td.indexOf(k)<0;});
 first.concat(rest).forEach(function(k){
  var s=SUBJ[k],played=s.topics.filter(function(t){return S.topics[t.id]&&S.topics[t.id].plays;}).length;
  h+='<button class="subj" style="--c:'+s.col+'" data-a="subj" data-s="'+k+'">'+(td.indexOf(k)>=0?'<span class="tag">Today</span>':'')+'<span class="em">'+s.emoji+'</span><b>'+s.name+'</b><small>'+played+' of '+s.topics.length+' tried</small></button>';
 });
 h+='<div class="subj lock" style="--c:var(--line)"><span class="em">🔒</span><b>Hindi</b><small>Coming soon</small></div></div>';
 h+='<button class="btn alt" data-a="parent" style="margin-top:24px">Parent corner</button>';
 return h;
}
function subjView(){
 var s=SUBJ[V.s],h='<div class="top"><button class="ghost" data-a="home" aria-label="Back">←</button><h1 style="font-size:26px">'+s.emoji+' '+s.name+'</h1></div>';
 s.topics.forEach(function(t){
  var tp=S.topics[t.id],lv=t.gen?'Level '+lvl(t.id):(t.mix?'':'');
  h+='<button class="row" data-a="start" data-t="'+t.id+'"><span class="tx"><b>'+esc(t.title)+'</b><small>'+esc(t.sub)+(lv?', '+lv:'')+'</small></span><span class="st" aria-label="'+starsOf(t.id)+' of 3 stars">'+starTxt(starsOf(t.id))+'</span></button>';
 });
 if(s.soon.length){h+='<h2>Coming soon</h2>'+s.soon.map(function(x){return '<div class="row soon"><span class="tx">'+esc(x)+'</span>🔒</div>';}).join('');}
 return h;
}
function quizView(){
 var q=Q.q,pct=Math.round(Q.done/Q.plan*100),r=Q.res;
 var h='<div class="top"><button class="ghost" data-a="home" aria-label="Leave this round">✕</button><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div><div class="runs" title="Runs scored">🏏 '+Q.runs+'</div></div>';
 h+='<div class="qcard"><div class="qmeta">'+esc(Q.t.title)+', question '+Math.min(Q.done+1,Q.plan)+' of '+Q.plan+'</div><div id="prompt" class="prompt">'+q.html+'</div><button class="speak" data-a="speak" aria-label="Read the question aloud">🔊</button></div>';
 if(q.t==='ch'){
  q.opts.forEach(function(o){var c='';if(r){if(o===q.ans)c=' ok';else if(o===r.v)c=' no';}
   h+='<button class="opt'+c+'" data-a="ans" data-v="'+esc(o)+'"'+(r?' disabled':'')+'>'+esc(o)+'</button>';});
 }else{
  h+='<div class="numval" id="numval" aria-live="polite">'+(r?esc(r.v):(Q.input||'?'))+'</div>';
  if(!r){h+='<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(k){return '<button data-a="key" data-k="'+k+'">'+k+'</button>';}).join('')+'<button data-a="key" data-k="del" aria-label="Delete">⌫</button><button data-a="key" data-k="0">0</button><button class="go" data-a="check" aria-label="Check answer">✔</button></div>';}
 }
 if(r){
  if(r.ok){h+='<div class="fb ok" role="status">'+(r.six?'<div class="six">SIX! 🏏💥</div>6 right in a row!':r.msg+' +1 run 🏏')+'</div>';}
  else{h+='<div class="fb no" role="status">Not quite. The answer is <b>'+esc(q.ans)+'</b>.'+(q.hint?'<br><small>'+esc(q.hint)+'</small>':'')+'<br><small>We will try one like this again.</small></div>';}
  h+='<button class="btn" data-a="next">'+(Q.queue.length?'Next question':'See my score')+'</button>';
 }
 return h;
}
function resultView(){
 var sc=V.score,st=sc>=.9?3:sc>=.7?2:sc>=.4?1:0;
 var msg=sc>=.9?'Black-belt effort!':sc>=.7?'Great practice!':sc>=.4?'Good try. Practice makes it easier.':'Keep going. Every try makes you stronger!';
 var h='<div class="center"><div class="big" aria-label="'+st+' of 3 stars">'+starTxt(st)+'</div><h1>'+msg+'</h1><p>'+Q.first+' of '+Q.firstTotal+' right the first time</p><p><b>+'+V.xp+' XP</b></p>';
 if(V.belt)h+='<div class="fb ok"><div class="six">🥋</div>New belt: <b>'+V.belt.n+'</b>!</div>';
 if(V.note)h+='<p class="muted">'+esc(V.note)+'</p>';
 h+='</div><button class="btn" data-a="again">Play again</button><button class="btn alt" data-a="subj" data-s="'+V.s+'">More topics</button><button class="btn alt" data-a="home">Home</button>';
 return h;
}
function parentView(){
 var h='<div class="top"><button class="ghost" data-a="home" aria-label="Back">←</button><h1 style="font-size:26px">Parent corner</h1></div>';
 h+='<div class="card"><b>'+esc(S.name||'Player')+'</b><br>'+S.xp+' XP, '+BELTS[beltIdx(S.xp)].n+' belt, '+S.streak+' day streak</div>';
 ORDER.forEach(function(k){
  h+='<h2>'+SUBJ[k].name+'</h2><table><tr><th>Topic</th><th>Rounds</th><th>Best</th><th>Overall</th></tr>';
  SUBJ[k].topics.forEach(function(t){var p=S.topics[t.id];
   h+='<tr><td>'+esc(t.title)+(t.gen&&p?' (L'+p.lvl+')':'')+'</td><td>'+(p?p.plays:0)+'</td><td>'+(p?Math.round(p.best*100)+'%':'-')+'</td><td>'+(p&&p.total?Math.round(p.correct/p.total*100)+'%':'-')+'</td></tr>';});
  h+='</table>';
 });
 h+='<p class="muted">Progress is saved in this browser on this device only. "Overall" counts answers that were right the first time.</p>';
 h+=V.confirm?'<button class="btn" style="background:var(--bad)" data-a="reset">Yes, erase all progress</button><button class="btn alt" data-a="parent">Cancel</button>':'<button class="btn alt" data-a="ask">Erase all progress</button>';
 return h;
}
function render(){
 var h;
 switch(V.n){case 'subj':h=subjView();break;case 'quiz':h=quizView();break;case 'result':h=resultView();break;case 'parent':h=parentView();break;default:h=homeView();}
 $('#app').innerHTML=h;
 var key=V.n+(V.s||'')+(V.confirm?'c':'');
 if(key!==lastKey&&V.n!=='quiz'){lastKey=key;try{window.scrollTo(0,0);}catch(e){}}
}

/* ---------- actions ---------- */
function keyPress(k){
 if(!Q||Q.res||Q.q.t!=='num')return;
 if(k==='del')Q.input=Q.input.slice(0,-1);else if(Q.input.length<4)Q.input+=k;
 var el=$('#numval');if(el)el.textContent=Q.input||'?';
}
function speak(){
 try{var p=$('#prompt');if(!p)return;var u=new SpeechSynthesisUtterance(p.innerText);u.lang='en-IN';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
var H={
 home:function(){V={n:'home'};render();},
 subj:function(d){V={n:'subj',s:d.s};render();},
 start:function(d){startTopic(d.t);},
 ans:function(d){answer(d.v);},
 key:function(d){keyPress(d.k);},
 check:function(){answer(Q.input);},
 next:function(){advance();},
 again:function(){startTopic(Q.t.id);},
 speak:speak,
 parent:function(){V={n:'parent'};render();},
 ask:function(){V={n:'parent',confirm:true};render();},
 reset:function(){S=blank();save();V={n:'home'};render();},
 name:function(){var el=$('#nm'),v=(el&&el.value||'').trim().slice(0,20);S.name=v||'Champ';save();V={n:'home'};render();}
};
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
 var f=H[b.dataset.a];if(f)f(b.dataset);
});
document.addEventListener('keydown',function(e){
 if(V.n!=='quiz'||!Q)return;
 if(e.target&&e.target.tagName==='INPUT')return;
 if(Q.res){if(e.key==='Enter'){e.preventDefault();advance();}return;}
 if(Q.q.t!=='num')return;
 if(/^[0-9]$/.test(e.key))keyPress(e.key);
 else if(e.key==='Backspace')keyPress('del');
 else if(e.key==='Enter')answer(Q.input);
});

window.SD={GEN:GEN,SUBJ:SUBJ,B:B};
render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
